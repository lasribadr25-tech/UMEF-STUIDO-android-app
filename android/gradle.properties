org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
# Desactive la compilation incrementale Kotlin : sur Windows, elle echoue
# systematiquement sur shared_preferences_android quand le projet est sur
# D: et le cache Pub sur C: ("Could not close incremental caches").
kotlin.incremental=false
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
